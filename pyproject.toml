[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceflow"
version = "0.1.0"
description = "A local evidence agent for scientific documents"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1,<2",
    "filelock>=3,<4",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "openai>=2,<3",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pymupdf>=1.24,<2",
    "python-dotenv>=1.0,<2",
    "sentence-transformers>=5,<6",
    "transformers>=4.48,<6",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]
# 本地工作台同源提供静态文件、流式问答及 PDF 上传。
web = [
    "fastapi>=0.115,<1",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "python-multipart>=0.0.22,<1",
    "uvicorn>=0.34,<1",
]
# 独立 HTTP 问答服务的安装入口。
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evidenceflow.webui" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "requires_model: loads the real BGE-M3 model; skipped unless it is in the local Hugging Face cache or EVIDENCEFLOW_RUN_MODEL_TESTS=1",
]
addopts = "-ra"
